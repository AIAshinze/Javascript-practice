<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelBloom — Contact Us</title>
  <link rel="icon" type="image/svg" href="./images/inspire-studio-travel-6913775.svg">
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-brand">
      <img src="./images/inspire-studio-travel-6913775.svg" alt="TravelBloom Logo" class="nav-logo">
      <span class="nav-title">TravelBloom</span>
    </div>

    <ul class="nav-links">
      <li><a href="./travel_recommendation.html" id="home" class="nav-link">Home</a></li>
      <li><a href="./about_us.html" id="aboutus" class="nav-link">About Us</a></li>
      <li><a href="./contact_us.html" id="contact" class="nav-link active">Contact Us</a></li>
    </ul>
  </nav>

  <!-- CONTACT HERO SECTION -->
  <section class="page-hero">
    <div class="hero-overlay"></div>

    <!-- Social Icons -->
    <div class="social-sidebar">
      <a href="#" class="social-link" aria-label="Twitter"><i class="fab fa-x-twitter"></i></a>
      <a href="#" class="social-link" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
      <a href="#" class="social-link" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="#" class="social-link" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
    </div>

    <!-- Page content -->
    <div class="page-content contact-layout">

      <!-- Left: title -->
      <div class="contact-left">
        <h1 class="page-title">Contact Us</h1>
        <p class="contact-tagline">Get in touch</p>
      </div>

      <!-- Right: form -->
      <div class="contact-form-box">

        <div class="form-group">
          <label for="contactName">Name</label>
          <input type="text" id="contactName" placeholder="Enter your name">
        </div>

        <div class="form-group">
          <label for="contactEmail">Email</label>
          <input type="email" id="contactEmail" placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label for="contactMessage">Message</label>
          <textarea id="contactMessage" rows="5" placeholder="Enter your message"></textarea>
        </div>

        <button class="btn-submit" id="btnSubmit">Submit</button>

      </div>
    </div>
  </section>

  <script src="./travel_recommendation.js"></script>
</body>
</html>
